<br>
<h1 class="h2">Record Details:</h1>
<hr>
<div id="recordContainer">
    <!-- Record details will be displayed here -->
</div>

<script>
  // Load notes.json first, then render the record
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const recordId = urlParams.get('id');
    loadNotes('notes.json').then(() => {
      showRecordById(recordId, 'recordContainer');
    }).catch(err => console.error('Failed to load notes.json', err));
  });
</script>
