---
layout: default
title: Dashboard
---

<div class="row">
  <div class="col-md-12">
    <br>
    <h2>Dashboard</h2>
    <hr>
    <table class="table table-striped table-sm" id="notesTable">
      <thead>
        <tr>
          <th scope="col">Title</th>
          <th scope="col">Category</th>
          <th scope="col">Link</th>
          <th scope="col">View Record</th>
        </tr>
      </thead>
      <tbody id="notesBody"></tbody>
    </table>
  </div>
</div>

<nav>
  <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<script>
  // Load notes.json and initialize list rendering
  const notesPerPage = 12;
  loadNotes('notes.json')
    .then(() => initListPage(window.notes, notesPerPage, 'notesBody', 'pagination'))
    .catch(err => console.error('Failed to load notes.json', err));
</script>
