---
layout: default
title: Tech News
---

<div class="row">
  <div class="col-md-12">
    <br>
    <h2>Tech News</h2>
    <hr>
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th scope="col">Title</th>
          <th scope="col">Comments</th>
        </tr>
      </thead>
      <tbody id="notesBody"></tbody>
    </table>
  </div>
</div>

<nav>
  <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<script>
  const category = "Tech News";
  const notesPerPage = 16;

  function renderNews(paginatedSubset) {
    return paginatedSubset.map(note => `
      <tr class="align-middle">
        <td class="text-primary fs-5">
            <a href="${encodeURI(note.link)}" target="_blank" rel="noopener noreferrer">${escapeHTML(note.title)}</a>
        </td>
        <td>${escapeHTML(note.comment)}</td>
      </tr>
    `).join('');
  }

  function buildAndInitNews() {
    const newsResults = (Array.isArray(window.notes) ? window.notes : [])
      .filter(note => note.category && note.category.toLowerCase().includes(category.toLowerCase()))
      .sort((a, b) => a.title.localeCompare(b.title));

    initListPage(newsResults, notesPerPage, 'notesBody', 'pagination', renderNews);
  }

  loadNotes('notes.json').then(buildAndInitNews).catch(err => console.error('Failed to load notes.json', err));
</script>
