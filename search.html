---
layout: default
title: Search Results
---

<div class="row">
  <div class="col-md-12">
    <br>
    <h2>Search Results</h2>
    <hr>
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th scope="col">Title</th>
          <th scope="col">Category</th>
          <th scope="col">Link</th>
          <th scope="col">View Record</th>
        </tr>
      </thead>
      <tbody id="notesBody"></tbody>
    </table>
  </div>
</div>

<nav>
  <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<script>
  function getSearchTerm() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('searchTerm') || '';
  }

  function filterNotes(term) {
    const lowerTerm = term.toLowerCase();
    return notes.filter(note => 
      (note.title && note.title.toLowerCase().includes(lowerTerm)) || 
      (note.category && note.category.toLowerCase().includes(lowerTerm)) || 
      (note.comment && note.comment.toLowerCase().includes(lowerTerm))
    );
  }

  const notesPerPage = 12;
  let currentPage = 1;

  // Defer building searchResults until notes.json is loaded
  function buildAndInitSearch() {
    const searchTerm = getSearchTerm();
    const searchResults = filterNotes(searchTerm);
    initListPage(searchResults, notesPerPage, 'notesBody', 'pagination');
  }

</script>
<script>
  // Load notes.json first, then build search results and initialize
  loadNotes('notes.json').then(() => {
    buildAndInitSearch();
  }).catch(err => console.error('Failed to load notes.json', err));
</script>
